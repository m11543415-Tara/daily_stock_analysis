name: catalyst_hotspot
display_name: 热点催化剂选股策略
description: 结合板块热点和事件催化剂识别短线强势机会

category: pattern
core_rules: [3, 5, 6, 7]

required_tools:
  - get_sector_rankings
  - search_stock_news
  - get_realtime_quote
  - get_stock_info

aliases: [热点选股, 催化剂, 题材选股]

default_active: true
default_router: false
default_priority: 20
market_regimes: [trending_up, volatile]

instructions: |
  **热点催化剂选股策略**

  本策略核心逻辑：催化剂确认方向 → 资金验证 → 技术找买点。
  不追纯概念炒作，只做有实质催化剂支撑的热点。

  **第一步：板块热度验证**
  使用 `get_sector_rankings` 获取板块涨跌榜：
  - 所在板块今日涨幅排名前10 → 强势板块加10分
  - 所在板块近3日持续上涨 → 持续性板块加8分
  - 所在板块今日跌幅前10 → 直接跳过，不分析

  **第二步：催化剂质量判断**
  使用 `search_stock_news` 搜索近7日新闻，按质量分级：

  高质量催化剂（加15分）：
  - 机构调研记录（基金/券商调研）
  - 业绩超预期公告（营收/利润增速加速）
  - 重大合同签订或新产品发布
  - 政策直接利好该公司主营业务

  中质量催化剂（加8分）：
  - 所在板块政策利好
  - 行业景气度提升报道
  - 分析师上调目标价

  低质量/无效催化剂（不加分）：
  - 纯概念蹭热点无实质业务
  - 市场传闻未经确认
  - 公司自己发风险提示说估值过高

  **第三步：资金行为验证**
  使用 `get_daily_history` 检查近10日：
  - 上涨日成交量总和 > 下跌日成交量总和1.2倍 → 资金在积累加8分
  - 今日量比 > 1.5 且价格上涨 → 当日有新资金进场加5分
  - 近3日连续缩量回调 → 洗盘特征加5分

  **第四步：风险排查**
  使用 `search_stock_news` 和 `get_stock_info` 检查：
  - 大股东减持公告 → 直接标注"存在减持风险"，评分-20
  - 公司自发风险提示（市场情绪过热）→ 评分-15
  - 市盈率亏损且无实质业务 → 标注"基本面风险"，评分-10
  - 近期有跌停记录 → 标注"筹码不稳定"，评分-8

  **综合判断：**
  - 有高质量催化剂 + 板块强势 + 资金买入 = 重点推荐，在buy_reason注明催化剂内容
  - 仅有概念无实质 = 在buy_reason注明"纯概念风险，谨慎参与"
  - 有减持公告 = 直接标注"不建议买入，存在减持"
