name: wyckoff_analysis
display_name: 威科夫量价分析策略
description: 基于威科夫百年量价理论识别主力吸筹派发行为

category: framework
core_rules: [3, 4, 6]

required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote

aliases: [威科夫, 主力行为, 吸筹派发, 弹簧效应]

default_active: true
default_router: false
default_priority: 15
market_regimes: [consolidation, trending_up, trending_down]

instructions: |
  **威科夫量价分析策略**

  威科夫理论核心：价格运动背后是主力的吸筹和派发行为。
  通过量价关系判断主力处于哪个阶段，顺势而为。

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第一步：判断当前处于哪个威科夫阶段】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  使用 `get_daily_history` 获取近60日数据：

  **吸筹阶段（底部蓄势，买入机会）：**
  阶段A - 卖压减弱：
  - 出现放量大跌后快速反弹（抛售高潮SC）
  - 随后成交量明显萎缩，跌势放缓
  - 标注："疑似抛售高潮，关注止跌信号"

  阶段B - 横盘吸筹：
  - 价格在区间内来回震荡，成交量逐渐萎缩
  - 偶尔出现假突破下方后快速收回（熊市陷阱）
  - 对应均线密集粘合形态
  - 标注："处于吸筹区间，等待突破方向"

  阶段C - 弹簧效应（最佳买点）：
  - 价格短暂跌破支撑位后快速收回
  - 成交量在跌破时萎缩（不是真实卖压）
  - 收盘价站稳区间下沿上方
  - 这是威科夫最经典的买入信号
  - 评分+20，标注："弹簧效应买点，主力最后洗盘"

  阶段D-E - 突破上涨：
  - 放量突破区间上沿
  - 回踩不破突破位（最后支撑点LPS）
  - 评分+15，标注："威科夫突破确认，趋势启动"

  **派发阶段（顶部出货，卖出信号）：**
  - 高位放量上涨后成交量不再增加
  - 出现多次冲高后未能创新高（上冲无力）
  - 价格高位横盘但成交量持续放大（出货信号）
  - 评分-15，标注："疑似派发阶段，警惕主力出货"

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第二步：九个买入检验（弹簧效应确认）】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  当识别到弹簧效应后，检查以下条件：
  满足6个以上 = 高质量买入信号，评分额外+10

  1. 成交量在下跌时萎缩（缩量下跌）✓/✗
  2. 收盘价站稳区间支撑位上方 ✓/✗
  3. 回调无新低（比前低更高）✓/✗
  4. 均线MA20开始走平或向上 ✓/✗
  5. 价格反弹时成交量放大 ✓/✗
  6. 近期有过明显的洗盘动作 ✓/✗
  7. 所在板块近期有资金流入 ✓/✗
  8. 无大股东减持公告 ✓/✗
  9. 市值合理（30-300亿弹性最佳）✓/✗

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第三步：相对强弱验证】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  使用 `get_sector_rankings` 验证：
  - 个股涨幅 > 所在板块涨幅 = 相对强势，加5分
  - 个股涨幅 < 所在板块涨幅 = 相对弱势，减5分
  - 下跌时个股跌幅 < 大盘跌幅 = 抗跌，加8分
  - 下跌时个股跌幅 > 大盘跌幅 = 弱势，减8分

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【输出格式】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  【威科夫阶段】吸筹B阶段/弹簧效应/派发阶段/上涨趋势
  【主力行为判断】正在建仓/正在拉升/正在出货/趋势不明
  【九个检验】满足X/9个条件
  【相对强弱】强于/弱于大盘和板块
  【操作建议】具体买入价位和止损位
