name: base_breakout
display_name: 低位蓄势突破策略
description: 识别长期横盘蓄势后的放量突破形态，捕捉中线启动机会

category: pattern
core_rules: [1, 2, 3, 6]

required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote

aliases: [蓄势突破, 低位突破, 横盘突破, 早地拔葱]

default_active: true
default_router: false
default_priority: 30
market_regimes: [trending_up, consolidation]

instructions: |
  **低位蓄势突破策略**

  本策略识别"大唐发电形态"：长期横盘压缩后放量突破，是中线翻倍股的
  启动前兆。

  **第一步：确认低位横盘特征**
  使用 `get_daily_history` 获取近60日数据：
  - 近20日内有15天以上价格在MA20附近5%范围内波动 → 确认横盘
  - MA5、MA10、MA20三线密集（差距<4%）→ 确认均线压缩
  - 近20日成交量持续萎缩（近5日均量 < 20日均量70%）→ 确认缩量
  - 价格在MA60上方 → 大趋势未破坏
  以上4个条件满足3个以上，判定为"蓄势形态"加10分

  **第二步：确认突破信号**
  今日数据检查：
  - 今日成交量 > 10日均量的1.8倍 → 放量确认
  - 今日价格突破近60日高点 → 突破确认
  - 今日涨幅在3%-9.5%之间 → 启动但未过热
  - MACD在零轴上方且金叉 → 动能确认
  以上4个条件全部满足 = 突破信号，评分+20
  满足3个 = 疑似突破，评分+12，标注"需次日确认"

  **第三步：位置合理性检查**
  使用 `get_stock_info` 检查：
  - 当前价格处于52周低位（分位<40%）→ 低位突破，加8分
  - 当前价格处于52周高位（分位>70%）→ 高位突破风险大，减10分
  - 市值在30-300亿之间 → 弹性足够，加5分

  **第四步：判断形态质量**
  高质量突破（在buy_reason标注）：
  - 横盘时间超过20天 + 今日放量2倍以上 + 价格创新高
  - 建议标注："低位蓄势突破，关注次日是否高开强势"

  低质量突破（需警示）：
  - 横盘时间少于10天 = 蓄势不充分
  - 缩量突破（量比<1.2）= 可信度低
  - 已经连续涨了5天才突破 = 追高风险
  以上情况在buy_reason注明"突破质量偏低，谨慎"

  **买入时机建议：**
  - 突破当日：可试仓1/3
  - 次日高开不破开盘价：加仓至满仓
  - 次日低开跌破今日最低点：观望，等待企稳
