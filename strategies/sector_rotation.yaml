name: sector_rotation
display_name: 行业轮动资金追踪策略
description: 追踪板块资金轮动规律，在热点启动初期提前布局

category: framework
core_rules: [2, 3, 5, 7]

required_tools:
  - get_sector_rankings
  - search_stock_news
  - get_daily_history
  - get_stock_info
  - get_realtime_quote

aliases: [行业轮动, 板块轮动, 资金追踪, 热点布局]

default_active: true
default_router: false
default_priority: 18
market_regimes: [trending_up, volatile]

instructions: |
  **行业轮动资金追踪策略**

  核心逻辑：资金在不同板块间轮动有规律可循。
  找到刚开始启动但还没大涨的板块，在个股还未追高前布局。

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第一步：板块轮动阶段判断】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  使用 `get_sector_rankings` 获取今日板块涨跌：

  **板块所处阶段判断：**

  启动初期（最佳布局时机）：
  - 板块今日涨幅排名进入前20%
  - 但近5日板块累计涨幅<10%
  - 板块内涨停股数量1-3只（刚开始联动）
  - 评分+15，标注："板块启动初期，布局最佳时机"

  加速上涨期（跟进但控制仓位）：
  - 板块近3日连续上涨
  - 板块内多只股票涨停
  - 龙头股涨幅已超20%
  - 评分+8，标注："板块加速期，追涨风险加大"

  过热期（不追，等回调）：
  - 板块近5日累计涨幅>20%
  - 媒体大量报道该板块
  - 涨停股开始出现次日低开
  - 评分-10，标注："板块过热，禁止追高，等回调"

  退潮期（离场信号）：
  - 板块今日跌幅明显
  - 龙头股出现高位放量大跌
  - 资金开始流向其他板块
  - 评分-20，标注："板块退潮，及时离场"

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第二步：个股在板块中的位置】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  使用 `get_daily_history` 检查个股相对板块表现：

  **强势个股特征（板块启动时优先选择）：**
  - 板块启动前个股已经提前上涨（领先板块）
  - 板块下跌时个股相对抗跌
  - 个股成交量先于板块放大
  - 机构调研记录比板块其他股票更密集
  评分+12，标注："板块内领涨股，优先布局"

  **弱势个股特征（即使板块强也要回避）：**
  - 板块大涨时个股涨幅远低于板块
  - 成交量持续低迷，市场关注度低
  - 基本面存在明显问题（亏损/减持）
  评分-8，标注："板块内弱势股，回避"

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第三步：催化剂持续性判断】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  使用 `search_stock_news` 搜索板块相关新闻：

  持续性强的催化剂（加分）：
  - 政策明确支持该行业（文件/规划）
  - 行业景气度数据改善（PMI/订单/出货）
  - 龙头企业业绩超预期带动板块
  - 全球同类资产同步上涨
  评分+10

  持续性弱的催化剂（谨慎）：
  - 单一事件触发（一次性利好）
  - 概念炒作无实质业务支撑
  - 仅凭情绪推动无资金持续流入
  评分-5，标注："催化剂持续性存疑"

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第四步：A股特有轮动规律参考】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  根据历史规律，以下轮动路径在A股常见，供参考：

  科技行情通常路径：
  芯片/半导体 → AI应用 → 算力 → 机器人 → 无人机

  能源行情通常路径：
  特高压/电网 → 储能 → 光伏/风电 → 绿电运营

  军工行情通常路径：
  军工装备 → 军工电子 → 航空航天 → 商业航天

  消费行情通常路径：
  白酒 → 食品饮料 → 医疗消费 → 零售

  当板块所处轮动位置处于路径早期，加分；
  当板块处于路径末端，减分并标注"轮动末段，谨慎"。

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【输出格式】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  【所在板块状态】启动初期/加速期/过热期/退潮期
  【个股板块地位】领涨股/跟涨股/弱势股
  【催化剂持续性】强/中/弱，原因说明
  【轮动位置】处于XX轮动路径的第X阶段
  【操作建议】布局/跟进/减仓/离场，附具体理由
