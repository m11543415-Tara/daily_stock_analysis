name: risk_control
display_name: 止损止盈风控策略
description: 基于均线和量价信号的持仓管理和风险控制

category: reversal
core_rules: [1, 2, 4, 5, 6]

required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
  - search_stock_news

aliases: [风控, 止损, 卖出信号, 减仓]

default_active: true
default_router: true
default_priority: 5
market_regimes: [trending_up, trending_down, volatile]

instructions: |
  **止损止盈风控策略**

  本策略专注于识别卖出信号，保护既有利润，控制最大亏损。
  适用于所有持仓股票的日常监控。

  **止损信号（立刻执行）：**
  使用 `get_daily_history` 检查：

  硬止损（必须执行）：
  - 价格跌破买入价5% → 无条件止损，在buy_reason标注"触发止损线"
  - 价格跌破MA20且成交量放大2倍以上 → 主力出货信号，立刻止损
  - 出现量增价跌连续2日 → 趋势转弱，减仓50%

  趋势止损（建议执行）：
  - MA5和MA10同时向下 → 短期趋势转弱，考虑减仓
  - 价格跌破MA20且收盘未能收回 → 中期趋势破坏，减仓或清仓
  - 均线从多头排列转为粘合 → 上涨动能减弱，部分减仓

  **移动止盈信号（保护利润）：**
  - 从买入后最高点回撤5% → 减仓50%，锁定部分利润
  - 从买入后最高点回撤8% → 全部清仓
  - 出现天量天价（成交量是前期的3倍以上）→ 可能见顶，减仓50%

  **止盈目标：**
  - 浮盈达到+10% → 建议减仓1/3
  - 浮盈达到+15% → 建议减仓1/2
  - 浮盈达到+20%以上 → 剩余仓位跟着均线走，跌破MA5止盈

  **新闻风险监控：**
  使用 `search_stock_news` 检查近3日：
  - 大股东减持公告 → 立刻标注"建议减仓"
  - 公司发布业绩下修公告 → 标注"基本面恶化，考虑止损"
  - 行业重大利空政策 → 标注"行业风险，评估减仓"

  **在分析报告中：**
  - 对持仓盈利股票：计算当前盈亏，给出持有/减仓/止盈建议
  - 对持仓亏损股票：检查是否触发止损线，给出明确止损价位
  - 对所有股票：在buy_reason中注明当前最近的支撑位和止损位
