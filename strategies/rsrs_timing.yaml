name: rsrs_timing
display_name: RSRS阻力支撑择时策略
description: 基于光大证券经典研报，通过支撑压力相对强度判断趋势转折

category: trend
core_rules: [2, 3, 6]

required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote

aliases: [RSRS, 支撑压力, 阻力支撑, 趋势转折]

default_active: true
default_router: false
default_priority: 12
market_regimes: [trending_up, trending_down, consolidation]

instructions: |
  **RSRS阻力支撑相对强度策略**

  RSRS核心逻辑：用最高价对最低价的线性回归斜率，
  衡量当前支撑和压力的相对强度，斜率越大说明买方越强势。

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第一步：计算RSRS斜率（简化版）】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  使用 `get_daily_history` 获取近18日最高价和最低价：

  计算逻辑（让AI理解）：
  - 用近18个交易日的最低价作为X轴
  - 用近18个交易日的最高价作为Y轴
  - 计算两者的线性回归斜率β

  斜率β的含义：
  - β > 1：高点涨幅大于低点涨幅，买方强势，上涨趋势强
  - β ≈ 1：买卖均衡，趋势中性
  - β < 1：高点涨幅小于低点涨幅，卖方强势，下跌趋势强

  **简化判断方法（无需精确计算）：**
  观察近18日K线：
  - 每次反弹高点都在抬高，且低点也在抬高 = β>1，强势
  - 高点抬高但低点没有抬高 = β≈1，中性
  - 高点没有抬高但低点在降低 = β<1，弱势
  - 高点和低点都在降低 = β<<1，下跌趋势

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第二步：RSRS信号判断】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  **买入信号（RSRS从低位向上突破）：**
  - 近期β从<1转为>1（支撑开始强于压力）
  - 对应均线从空头开始粘合或金叉
  - 成交量同步放大
  - 评分+15，标注："RSRS买入信号，支撑开始占主导"

  **持有信号（RSRS维持高位）：**
  - β持续>1且稳定上升
  - 每次回调低点不破前低
  - 评分+8，标注："RSRS持续强势，趋势健康"

  **卖出预警（RSRS从高位向下回落）：**
  - 近期β从>1转为<1（压力开始强于支撑）
  - 对应均线开始走平或死叉
  - 成交量在上涨时开始萎缩
  - 评分-12，标注："RSRS卖出预警，压力开始占主导"

  **空仓信号（RSRS维持低位）：**
  - β持续<1
  - 每次反弹高点不过前高
  - 评分-18，标注："RSRS持续弱势，建议空仓观望"

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第三步：与均线系统双重确认】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  RSRS信号必须结合均线验证：

  RSRS买入 + 均线多头排列 = 强烈买入，评分额外+10
  RSRS买入 + 均线空头排列 = 可能是短暂反弹，谨慎，评分+3
  RSRS卖出 + 均线死叉 = 强烈卖出，评分额外-12
  RSRS中性 + 均线粘合 = 等待方向，观望

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【输出格式】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  【RSRS状态】强势(β>1)/中性(β≈1)/弱势(β<1)
  【趋势特征】高低点均在抬高/高点抬高低点不变/逐级下降
  【均线双确认】RSRS与均线方向一致/分歧
  【操作建议】买入/持有/减仓/空仓，附具体价位
