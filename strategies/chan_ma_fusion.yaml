yaml
name: chan_ma_fusion
display_name: 缠论均线融合策略
description: 结合缠论买卖点和均线量价系统，双重验证提高胜率

category: framework
core_rules: [1, 2, 3, 4, 5, 6]

required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
  - search_stock_news
  - get_stock_info

aliases: [缠论买点, 二买, 三买, 背驰, 中枢, 缠论均线]

default_active: true
default_router: false
default_priority: 8
market_regimes: [trending_up, consolidation, volatile]

instructions: |
  **缠论均线融合策略**

  本策略将缠论三类买卖点与均线量价系统融合，要求两套体系同时
  发出信号才确认买卖点，双重验证提高胜率。

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第一层：识别缠论结构】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  使用 `get_daily_history` 获取近60日数据，识别以下结构：

  **中枢识别（横盘整理区间）：**
  近20日内价格反复在某个区间震荡，上下边界明确，
  这就是缠论的"中枢"，对应均线粘合形态。
  - 价格在中枢内运行 = 等待方向选择
  - 价格突破中枢上沿 = 潜在三买机会
  - 价格跌破中枢下沿 = 潜在三卖信号

  **背驰识别（力度减弱）：**
  下跌背驰特征（一买前兆）：
  - 价格创新低但成交量小于前一段下跌的量
  - 跌幅逐渐收窄（每波下跌幅度在减小）
  - MACD柱子高度低于前一波下跌
  上涨背驰特征（一卖前兆）：
  - 价格创新高但成交量小于前一段上涨的量
  - 涨幅逐渐收窄（每波上涨幅度在减小）
  - MACD柱子高度低于前一波上涨

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第二层：三类买点识别】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  **缠论一买（逆势抄底，风险最高）：**
  条件：下跌趋势末端出现背驰
  均线验证：价格已跌破MA60，但成交量极度萎缩
  操作：轻仓试探，止损设在近期低点下方3%
  评分调整：+5（风险高，不作为主要买点）
  在buy_reason注明："疑似一买，背驰特征，轻仓试探"

  **缠论二买（回调不破，中等风险）：**
  条件：
  1. 前期有过一个明显低点（一买位置）
  2. 从低点反弹后出现回调
  3. 回调不破前低（高于前低点）
  4. 缩量回调，成交量小于前一段下跌
  均线验证（双重确认）：
  - 回调时价格守住MA20或MA60
  - MA5开始走平或向上翻
  - 成交量持续萎缩（符合"量缩价跌"健康回调特征）
  操作：这是最佳买点，可以建半仓
  评分调整：+18
  在buy_reason注明："缠论二买+均线支撑，最优买点"

  **缠论三买（突破确认，风险最低）：**
  条件：
  1. 价格突破前期中枢上沿（前期震荡区间高点）
  2. 突破后出现回踩（回调但不进入中枢）
  3. 回踩缩量，再次放量上攻
  均线验证（双重确认）：
  - 突破时MA5>MA10>MA20（多头排列确认）
  - 突破成交量是均量的1.5倍以上
  - 回踩时价格守住MA5或突破位
  操作：最安全的买点，可以建满仓
  评分调整：+22
  在buy_reason注明："缠论三买+多头排列，趋势确认"

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第三层：三类卖点识别】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  **缠论一卖（上涨背驰，减仓信号）：**
  条件：上涨趋势末端，涨幅收窄，成交量萎缩
  均线验证：
  - 价格远离MA20超过20%（过度拉升）
  - 成交量出现天量后萎缩
  操作：减仓1/3到1/2
  评分调整：-12
  在buy_reason注明："上涨背驰特征，建议减仓"

  **缠论二卖（反弹受压，加速离场）：**
  条件：
  1. 从高点下跌后出现反弹
  2. 反弹高度不超过前高
  3. 反弹缩量，力度弱于前一段上涨
  均线验证：
  - 反弹至MA20或MA60附近受压回落
  - MA5开始向下穿越MA10
  操作：减仓到轻仓或清仓
  评分调整：-18
  在buy_reason注明："缠论二卖，反弹受压，建议离场"

  **缠论三卖（跌破确认，清仓信号）：**
  条件：
  1. 价格跌破前期中枢下沿
  2. 跌破后反弹不回中枢
  3. 成交量在下跌时放大
  均线验证：
  - 均线空头排列已形成
  - MA5向下穿越MA20（死叉）
  操作：立即清仓
  评分调整：-25
  在buy_reason注明："缠论三卖+均线死叉，趋势终结，立即清仓"

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【第四层：中天火箭等持仓股专项检查】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  对于已持仓股票（可从新闻或问题上下文判断），
  额外检查：

  使用 `search_stock_news` 检查近7日：
  - 有无减持公告 → 有则标注"存在减持风险，建议止损"
  - 有无业绩下修 → 有则标注"基本面恶化"
  - 有无即将到来的催化剂（发射/业绩/调研）→
    标注"X月X日有催化剂窗口"

  当前持仓盈亏判断：
  - 盈利超过+15% → 建议减半仓锁定利润
  - 亏损超过-5% → 触发止损线，建议止损
  - 亏损在-3%到-5%之间 → 关注是否出现二卖信号

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  【输出格式要求】
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  每次分析必须输出：
  1. 当前缠论结构判断（中枢震荡/上涨趋势/下跌趋势）
  2. 最近的买卖点类型（一/二/三买卖点，或无信号）
  3. 均线验证结果（是否与缠论信号一致）
  4. 具体操作建议（买入/持有/减仓/止损）
  5. 关键价位（支撑位/压力位/止损位）

  格式示例：
  【缠论结构】上涨趋势中的回调整理
  【买卖点】疑似缠论二买，回调不破前低
  【均线验证】MA20支撑有效，成交量缩量确认
  【操作建议】可建仓，止损设XX元
  【关键价位】支撑XX元，压力XX元，止损XX元
